<body>


<div class="yansix-container">


<!-- ÁREA DE CONVERSA -->

<main class="conversation">


<div class="brand">

<h1>YANSIX</h1>

<span>
Diagnóstico Inteligente
</span>

</div>





<section class="question-box">


<div class="ai-message">

<p id="mensagem">

Agora vou entender melhor seu momento atual.

</p>

</div>





<h2 id="pergunta">

Qual sua idade?

</h2>





<div class="options" id="opcoes">


<button 
class="option"
onclick="responder('18 a 25 anos')">

18 a 25 anos

</button>



<button 
class="option"
onclick="responder('26 a 35 anos')">

26 a 35 anos

</button>



<button 
class="option"
onclick="responder('36 a 50 anos')">

36 a 50 anos

</button>



<button 
class="option"
onclick="responder('Acima de 50 anos')">

Acima de 50 anos

</button>



</div>





<div id="respostaUsuario"
class="user-response">

</div>




<button

id="proximo"

class="primary-button"

style="display:none"

onclick="proxima()">

Próxima pergunta

</button>



</section>







<!-- PROGRESSO -->

<footer class="progress">


<span id="contador">

Pergunta 1 de 5

</span>



<div class="progress-bar">

<div 
id="barra"
class="progress-fill">

</div>

</div>


</footer>




</main>









</div>







<script src="js/yansix.js"></script>




<script>


const perguntas = [


{

texto:

"Qual sua idade?",

opcoes:[

"18 a 25 anos",

"26 a 35 anos",

"36 a 50 anos",

"Acima de 50 anos"

]

},



{

texto:

"Qual seu principal objetivo?",

opcoes:[

"Melhorar aparência",

"Mais saúde",

"Performance",

"Prevenção"

]

},




{

texto:

"Como está sua rotina atualmente?",

opcoes:[

"Organizada",

"Pouco equilibrada",

"Muito corrida",

"Estou buscando mudança"

]

},




{

texto:

"Qual resultado você busca primeiro?",

opcoes:[

"Resultados rápidos",

"Melhora gradual",

"Transformação completa",

"Manutenção"

]

},




{

texto:

"Você já realizou algum tratamento antes?",

opcoes:[

"Sim",

"Não",

"Estou começando agora"

]

}


];





let atual = 0;





function carregarPergunta(){



document.getElementById("pergunta")
.innerText =
perguntas[atual].texto;




let area =
document.getElementById("opcoes");



area.innerHTML="";





perguntas[atual].opcoes.forEach(opcao=>{



area.innerHTML +=

`

<button

class="option"

onclick="responder('${opcao}')">

${opcao}

</button>


`;



});




document.getElementById("contador")
.innerText =

`
Pergunta ${atual+1} de ${perguntas.length}
`;




document.getElementById("barra")
.style.width =

((atual)/perguntas.length)*100+"%";



}






function responder(resposta){



document.getElementById("respostaUsuario")
.innerHTML =

`

<div class="selected">

Sua resposta:

<strong>${resposta}</strong>

</div>

`;




localStorage.setItem(

"resposta_"+atual,

resposta

);





document.getElementById("proximo")
.style.display="block";



}







function proxima(){



atual++;




if(atual < perguntas.length){


document.getElementById("proximo")
.style.display="none";



document.getElementById("respostaUsuario")
.innerHTML="";



carregarPergunta();



}

else{


window.location.href="resultado.html";


}



}




carregarPergunta();



</script>
