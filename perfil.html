<body>



<div class="background-glow"></div>





<main class="container">





<section class="profile-card">






<header class="brand">


<h1>

YANSIX

</h1>


<p>

Antes do diagnóstico, conheça sua empresa

</p>


</header>









<div class="intro">


<h2>

Vamos entender seu negócio

</h2>



<p>

Estas informações ajudam a criar um diagnóstico
mais preciso sobre sua presença digital e oportunidades.

</p>



</div>









<form id="formPerfil">







<div class="field">


<label>

Nome

</label>


<input

type="text"

id="nome"

placeholder="Seu nome"

required>


</div>








<div class="field">


<label>

Empresa

</label>


<input

type="text"

id="empresa"

placeholder="Nome da empresa"

required>


</div>








<div class="field">


<label>

Segmento da empresa

</label>


<input

type="text"

id="segmento"

placeholder="Ex: Saúde, Tecnologia, Serviços">


</div>








<div class="field">


<label>

Cargo ou função

</label>



<input

type="text"

id="cargo"

placeholder="Ex: Diretor, Proprietário, Gestor">


</div>








<div class="field">


<label>

Quantidade de funcionários

</label>



<select id="funcionarios">


<option value="1-5">

1 a 5 funcionários

</option>



<option value="6-20">

6 a 20 funcionários

</option>



<option value="21-50">

21 a 50 funcionários

</option>



<option value="51+">

Mais de 50 funcionários

</option>


</select>


</div>









<div class="field">


<label>

Website

</label>



<input

type="url"

id="site"

placeholder="https://">


</div>








<div class="field">


<label>

Instagram

</label>



<input

type="text"

id="instagram"

placeholder="@suaempresa">


</div>








<div class="field">


<label>

Google Meu Negócio

</label>



<select id="googleNegocio">


<option value="Não possui">

Não possui

</option>



<option value="Possui incompleto">

Possui incompleto

</option>



<option value="Completo">

Completo e atualizado

</option>



</select>


</div>








<div class="field">


<label>

Principal objetivo atualmente

</label>



<select id="objetivo">


<option value="Aumentar vendas">

Aumentar vendas

</option>



<option value="Atrair clientes">

Atrair novos clientes

</option>



<option value="Fortalecer marca">

Fortalecer autoridade da marca

</option>



<option value="Organizar processos">

Organizar processos comerciais

</option>


</select>


</div>








<button

type="submit"

class="primary-button">


Continuar diagnóstico →


</button>








</form>









<footer>


<p>

YANSIX • Avalia • Analisa • Recomenda • Transforma

</p>


</footer>








</section>






</main>
