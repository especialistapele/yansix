<style>
:root{--bg:#f4f5f7;--ink:#20242a;--muted:#68727d;--brown:#1b1008;--gold:#e8a93c;--line:#e1e4e8;--card:#fff;--ok:#dff5e4;--okink:#17652c;--warn:#fff2cf;--warnink:#785900;--bad:#ffe0e0;--badink:#8b1d1d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{background:var(--brown);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:10}.top strong{font-size:19px}.wrap{max-width:1320px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 14px rgba(0,0,0,.05)}.metric{font-size:28px;font-weight:800;margin-top:7px}.muted{color:var(--muted);font-size:13px}.nav{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--gold);color:#1b1008;font-weight:800}.nav button.alt,.btn.alt{background:#eceef1;color:#25282c}.btn.danger{background:#f5c7c7;color:#7c1d1d}.btn.small{padding:7px 10px;font-size:12px}.section{display:none}.section.active{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px;vertical-align:middle}.status{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#eee}.ok{background:var(--ok);color:var(--okink)}.warn{background:var(--warn);color:var(--warnink)}.bad{background:var(--bad);color:var(--badink)}.login{max-width:430px;margin:12vh auto}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d3d7dc;border-radius:9px;font:inherit;background:#fff}.field textarea{min-height:84px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.msg{padding:10px;border-radius:8px;margin:10px 0;background:#f0f2f4}.error{background:var(--bad);color:var(--badink)}.success{background:var(--ok);color:var(--okink)}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:#737b84}.scroll{overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal-back.open{display:flex}.modal{width:min(1050px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modal h2{margin-top:0}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.subnav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}.subnav button{border:0;background:#eef0f2;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:700}.subnav button.active{background:var(--gold);color:#1b1008}.subsection{display:none}.subsection.active{display:block}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:4px;background:#f0f2f4;padding:6px 8px;border-radius:7px;font-size:12px}.preview{border-radius:12px;overflow:hidden;background:#1b1008;color:#fff;min-height:210px;position:relative;background-size:cover;background-position:center bottom}.preview .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,8,4,.78),rgba(14,8,4,.45),rgba(14,8,4,.18))}.preview .content{position:relative;z-index:1;padding:22px;text-align:center}.preview .title{font-family:Georgia,serif;font-style:italic;font-size:24px}.color-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.color-row input{height:42px;padding:3px}.schedule-row{display:grid;grid-template-columns:120px 130px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px}.notice{font-size:12px;color:var(--muted);line-height:1.45}.demo-links a{display:inline-block;margin:3px 6px 3px 0}.search{max-width:280px}.right{margin-left:auto}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.formgrid.three{grid-template-columns:1fr}.schedule-row{grid-template-columns:1fr}.color-row{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.top{padding:13px}.top strong{font-size:16px}.modal{padding:14px}}
</style>

<body>
<div id="app"></div>
<div id="modalBack" class="modal-back"><div class="modal" id="modal"></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://scnzyxvtaizfsbwiofvf.supabase.co';
const SUPABASE_KEY='sb_publishable_nApY5cRNCcrSeUuhz3eJpQ_-Pqki3n-';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const localMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'};
const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const dayLong=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
let state={padarias:[],admins:[],cobrancas:[],assinaturas:[],planos:[],selected:null,tab:'dash',data:{}};

function login(){
 $('app').innerHTML=`<div class="login panel"><h1>Hora do Pão</h1><p class="muted">Painel do usuário Master</p><div id="loginMsg"></div><div class="field"><label>E-mail</label><input id="email" type="email" value="yansix.tech@gmail.com"></div><div class="field"><label>Senha</label><input id="senha" type="password" autocomplete="current-password"></div><button class="btn" id="entrar">Entrar</button></div>`;
 $('entrar').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('senha').value});if(error){$('loginMsg').innerHTML=`<div class="msg error">${esc(error.message)}</div>`;return}await iniciar()};
}
async function iniciar(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){login();return}
 const {data:p,error}=await sb.from('profiles').select('papel,ativo,nome').eq('id',user.id).single();
 if(error||p?.papel!=='master'||!p.ativo){await sb.auth.signOut();$('app').innerHTML='<div class="login panel"><h2>Acesso não autorizado</h2><p>Este usuário não possui perfil Master.</p></div>';return}
 await carregar();render();
}
async function carregar(){
 try{await sb.rpc('atualizar_atrasos')}catch(e){}
 const [p,a,c,s,pl]=await Promise.all([
  sb.from('padarias').select('id,nome,nome_comercial,slug,ativa,cidade,estado,telefone,email,endereco,informacoes_publicas').order('nome'),
  sb.from('profiles').select('id,nome,login,padaria_id,ativo,criado_em').eq('papel','admin').order('nome'),
  sb.from('cobrancas_mensais').select('*').order('vencimento_em',{ascending:false}),
  sb.from('assinaturas_padaria').select('padaria_id,plano_id,valor_mensal,dia_vencimento,inicio_em,fim_em,status,observacoes'),
  sb.from('planos').select('id,nome,descricao,valor_mensal,ativo').order('valor_mensal')
 ]);
 if(p.error)console.error(p.error);state.padarias=p.data||[];state.admins=a.data||[];state.cobrancas=c.data||[];state.assinaturas=s.data||[];state.planos=pl.data||[];
 const pc=await sb.from('plataforma_config').select('valor').eq('chave','cobranca').maybeSingle();state.pagto=pc.data?.valor||{favorecido:'',pix_chave:'',instrucoes:''};
}
function shell(content){
 const active=x=>state.tab===x?'active':'';
 $('app').innerHTML=`<header class="top"><strong>HORA DO PÃO · MASTER</strong><div class="actions"><span class="muted" style="color:#fff">${esc(state.userName||'Master')}</span><button class="btn alt" id="sair">Sair</button></div></header><div class="wrap"><div class="grid">${metrics()}</div><nav class="nav"><button class="${active('dash')}" data-tab="dash">Dashboard</button><button class="${active('pad')}" data-tab="pad">Padarias</button><button class="${active('admin')}" data-tab="admin">Administradores</button><button class="${active('prog')}" data-tab="prog">Programação</button><button class="${active('index')}" data-tab="index">Index</button><button class="${active('fin')}" data-tab="fin">Financeiro</button><button class="${active('plan')}" data-tab="plan">Planos</button><button class="${active('arm')}" data-tab="arm">Armazenamento</button><button class="${active('logs')}" data-tab="logs">Logs</button></nav>${content}</div>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('sair').onclick=async()=>{await sb.auth.signOut();login()};
}
function metrics(){const active=state.padarias.filter(x=>x.ativa).length;const open=state.cobrancas.filter(x=>['pendente','atrasado'].includes(x.status)).reduce((s,x)=>s+Number(x.valor),0);const paid=state.cobrancas.filter(x=>x.status==='pago').reduce((s,x)=>s+Number(x.valor),0);return `<div class="card"><div class="muted">Padarias</div><div class="metric">${state.padarias.length} / 30</div></div><div class="card"><div class="muted">Ativas</div><div class="metric">${active}</div></div><div class="card"><div class="muted">Recebido</div><div class="metric">${money(paid)}</div></div><div class="card"><div class="muted">Em aberto</div><div class="metric">${money(open)}</div></div>`}
function render(){
 const content=state.tab==='dash'?dash():state.tab==='pad'?padTab():state.tab==='admin'?adminTab():state.tab==='prog'?progTab():state.tab==='index'?indexTab():state.tab==='fin'?finTab():state.tab==='arm'?armTab():state.tab==='logs'?logsTab():planTab();
 shell(content);
 bindTab();
 if(state.tab==='dash')loadDash();
 if(state.tab==='arm')loadArm();
 if(state.tab==='logs')loadLogs();
 if(state.tab==='prog' && (state.selected||state.padarias[0])){
   const p=state.selected||state.padarias[0];
   state.selected=p;
   loadProgEditor(p.id);
 }
 if(state.tab==='index' && (state.selected||state.padarias[0])){
   const p=state.selected||state.padarias[0];
   state.selected=p;
   loadIndexEditor(p.id);
 }
}
function bindTab(){
 if($('novoPad'))$('novoPad').onclick=()=>openPadariaForm();
 if($('novoAdmin'))$('novoAdmin').onclick=()=>openAdminForm();
 if($('novaCobranca'))$('novaCobranca').onclick=openCobrancaForm;
 if($('gerarTodos'))$('gerarTodos').onclick=gerarTodos;
 if($('refresh'))$('refresh').onclick=async()=>{await carregar();render()};
 document.querySelectorAll('[data-open-pad]').forEach(b=>b.onclick=()=>openPadDetail(b.dataset.openPad));
 document.querySelectorAll('[data-toggle-admin]').forEach(b=>b.onclick=()=>toggleAdmin(b.dataset.toggleAdmin,b.dataset.value!=='true'));
 document.querySelectorAll('[data-reset-admin]').forEach(b=>b.onclick=()=>resetAdmin(b.dataset.resetAdmin));
 if($('dadosPag'))$('dadosPag').onclick=openDadosPagamento;
 if($('enviarTodos'))$('enviarTodos').onclick=enviarTodos;
 document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>enviarExistente(b.dataset.send));
 document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>abrirCanal('wa',b.dataset.wa));
 document.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>abrirCanal('mail',b.dataset.mail));
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>pagar(b.dataset.pay));
 document.querySelectorAll('[data-plan-toggle]').forEach(b=>b.onclick=()=>togglePlan(b.dataset.planToggle,b.dataset.value!=='true'));
}
function dash(){return `<section class="panel"><div class="toolbar"><div><h2 style="margin:0">Dashboard</h2><p class="muted">Visão geral da plataforma · fuso America/Sao_Paulo.</p></div><button class="btn" id="gerarTodos">Gerar cobranças do mês</button></div><div id="dashBox"><p class="muted">Carregando…</p></div></section>`}
function padTab(){return `<section class="panel"><div class="toolbar"><div><h2 style="margin:0">Padarias</h2><p class="muted">Cada estabelecimento possui sua própria pasta e sua própria index: estabelecimentos/&lt;slug&gt;/index.html.</p></div><div class="actions"><button class="btn" id="novoPad">+ Nova padaria</button><button class="btn alt" id="refresh">Atualizar</button></div></div><div class="scroll"><table class="table"><thead><tr><th>Padaria</th><th>Slug</th><th>Pasta da Index</th><th>Cidade</th><th>Admin</th><th>Status</th><th>Ações</th></tr></thead><tbody>${state.padarias.map(p=>{const admins=state.admins.filter(a=>a.padaria_id===p.id).length;return `<tr><td><strong>${esc(p.nome_comercial||p.nome)}</strong><br><span class="muted">${esc(p.email||'')}</span></td><td>${esc(p.slug)}</td><td><code>estabelecimentos/${esc(p.slug)}/index.html</code></td><td>${esc([p.cidade,p.estado].filter(Boolean).join(' / ')||'—')}</td><td>${admins}</td><td><span class="status ${p.ativa?'ok':'bad'}">${p.ativa?'Ativa':'Inativa'}</span></td><td><div class="actions"><button class="btn small" data-open-pad="${p.id}">Gerenciar</button><a class="btn small alt" target="_blank" href="estabelecimentos/${encodeURIComponent(p.slug)}/index.html">Index</a><a class="btn small" target="_blank" href="painel-admin.html?padaria=${p.id}">Acessar painel</a><button class="btn small" data-publish-index="${p.id}">Publicar</button></div></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nenhuma padaria cadastrada.</td></tr>'}</tbody></table></div></section>`}
function adminTab(){return `<section class="panel"><div class="toolbar"><div><h2 style="margin:0">Administradores</h2><p class="muted">Usuários de acesso das padarias. A senha inicial é criada pelo Master.</p></div><button class="btn" id="novoAdmin">+ Novo administrador</button></div><div class="scroll"><table class="table"><thead><tr><th>Nome</th><th>Login</th><th>Padaria</th><th>Status</th><th>Ações</th></tr></thead><tbody>${state.admins.map(a=>{const p=state.padarias.find(x=>x.id===a.padaria_id);return `<tr><td>${esc(a.nome||'—')}</td><td>${esc(a.login||'—')}</td><td>${esc(p?.nome_comercial||p?.nome||'—')}</td><td><span class="status ${a.ativo?'ok':'bad'}">${a.ativo?'Ativo':'Desativado'}</span></td><td><div class="actions"><button class="btn small" data-toggle-admin="${a.id}" data-value="${a.ativo}">${a.ativo?'Desativar':'Ativar'}</button><button class="btn small alt" data-reset-admin="${a.id}">Nova senha</button></div></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Nenhum administrador cadastrado.</td></tr>'}</tbody></table></div></section>`}
function progTab(){const p=state.selected||state.padarias[0];return `<section class="panel"><div class="toolbar"><div><h2 style="margin:0">Programação dos pães</h2><p class="muted">Escolha uma padaria para administrar os horários e os dias.</p></div><select id="progPad" class="search">${state.padarias.map(x=>`<option value="${x.id}" ${x.id===p?.id?'selected':''}>${esc(x.nome_comercial||x.nome)}</option>`).join('')}</select></div>${p?programacaoEditor(p):'<div class="empty">Cadastre uma padaria primeiro.</div>'}</section>`}
function indexTab(){const p=state.selected||state.padarias[0];return `<section class="panel"><div class="toolbar"><div><h2 style="margin:0">Configuração da Index</h2><p class="muted">Texto, cores e intensidade do fundo. As quatro imagens enviadas permanecem fixas na sequência 01/02/03/04.</p></div><select id="indexPad" class="search">${state.padarias.map(x=>`<option value="${x.id}" ${x.id===p?.id?'selected':''}>${esc(x.nome_comercial||x.nome)}</option>`).join('')}</select></div>${p?indexEditor(p):'<div class="empty">Cadastre uma padaria primeiro.</div>'}</section>`}
function hojeSP(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date())}
function statusReal(c){return c.status==='pendente'&&c.vencimento_em<hojeSP()?'atrasado':c.status}
const dBR=d=>d?d.split('-').reverse().join('/'):'—';
const compBR=d=>d?d.slice(5,7)+'/'+d.slice(0,4):'—';
function textoCobranca(c,extra){const p=state.padarias.find(x=>x.id===c.padaria_id),g=state.pagto||{};return `Olá${p?', '+(p.nome_comercial||p.nome):''}! Mensalidade do Hora do Pão — competência ${compBR(c.competencia)}.\nValor: ${money(c.valor)}\nVencimento: ${dBR(c.vencimento_em)}\n`+(g.pix_chave?`PIX: ${g.pix_chave}${g.favorecido?' ('+g.favorecido+')':''}\n`:'')+(g.instrucoes?g.instrucoes+'\n':'')+(extra?extra+'\n':'')}
function finTab(){
 const open=state.cobrancas.filter(x=>['pendente','atrasado'].includes(x.status)),atr=state.cobrancas.filter(x=>statusReal(x)==='atrasado'),naoEnv=open.filter(x=>!x.enviada_em);
 return `<section class="panel"><div class="toolbar"><div><h2 style="margin:0">Financeiro</h2><p class="muted">Gere e envie a mensalidade para cada unidade. A cobrança enviada aparece no painel da padaria.</p></div><div class="actions"><button class="btn" id="novaCobranca">+ Enviar cobrança</button><button class="btn alt" id="gerarTodos">Gerar mês para todas</button><button class="btn alt" id="enviarTodos">Enviar pendentes (${naoEnv.length})</button><button class="btn alt" id="dadosPag">Dados de pagamento</button></div></div>
 ${!state.pagto?.pix_chave?'<div class="msg error">Cadastre a chave PIX em “Dados de pagamento” para ela aparecer nas cobranças.</div>':''}
 <div class="msg">Em aberto: <strong>${money(open.reduce((a,x)=>a+Number(x.valor),0))}</strong> · Em atraso: <strong>${atr.length}</strong> · Recebido: <strong>${money(state.cobrancas.filter(x=>x.status==='pago').reduce((a,x)=>a+Number(x.valor),0))}</strong></div>
 <div class="scroll"><table class="table"><thead><tr><th>Padaria</th><th>Competência</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Envio</th><th>Ação</th></tr></thead><tbody>${state.cobrancas.map(c=>{const p=state.padarias.find(x=>x.id===c.padaria_id),st=statusReal(c),fechada=['pago','cancelado'].includes(c.status);
 const env=c.enviada_em?`<span class="status ${c.visualizada_em?'ok':'warn'}">${c.visualizada_em?'Visualizada':'Enviada'}</span><br><span class="muted">${new Date(c.enviada_em).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})}</span>`:'<span class="status">Não enviada</span>';
 return `<tr><td>${esc(p?.nome_comercial||p?.nome||'—')}</td><td>${compBR(c.competencia)}</td><td>${money(c.valor)}</td><td>${dBR(c.vencimento_em)}</td><td><span class="status ${st==='pago'?'ok':st==='atrasado'?'bad':'warn'}">${esc(st)}</span></td><td>${env}</td><td>${fechada?'—':`<div class="actions"><button class="btn small" data-send="${c.id}">${c.enviada_em?'Reenviar':'Enviar'}</button>${p?.telefone?`<button class="btn small alt" data-wa="${c.id}">WhatsApp</button>`:''}${p?.email?`<button class="btn small alt" data-mail="${c.id}">E-mail</button>`:''}<button class="btn small alt" data-pay="${c.id}">Registrar pagamento</button></div>`}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nenhuma cobrança.</td></tr>'}</tbody></table></div></section>`}
function openDadosPagamento(){const g=state.pagto||{};openModal(`<div class="modal-head"><h2>Dados de pagamento</h2><button class="btn alt" data-close-modal>Fechar</button></div><p class="muted">Aparecem em toda cobrança enviada e no painel das padarias.</p><form id="pagForm"><div class="field"><label>Favorecido</label><input name="favorecido" value="${esc(g.favorecido||'')}"></div><div class="field"><label>Chave PIX</label><input name="pix_chave" value="${esc(g.pix_chave||'')}"></div><div class="field"><label>Instruções</label><textarea name="instrucoes" maxlength="400">${esc(g.instrucoes||'')}</textarea></div><button class="btn" type="submit">Salvar</button><div id="pagMsg"></div></form>`);$('modal').querySelector('[data-close-modal]').onclick=closeModal;$('pagForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.currentTarget).entries());for(const k in v)v[k]=v[k].trim();const r=await sb.from('plataforma_config').upsert({chave:'cobranca',valor:v,atualizado_em:new Date().toISOString()});if(r.error)return msg('pagMsg',r.error.message.includes('plataforma_config')?'Rode antes o SQL supabase/migrations/20261005_envio_cobrancas.sql no Supabase.':r.error.message,true);state.pagto=v;msg('pagMsg','Dados salvos.');render()}}
function erroMig(e){return /enviar_cobranca|enviada_em|schema cache|does not exist/i.test(e.message||'')?'Rode antes o SQL supabase/migrations/20261005_envio_cobrancas.sql no SQL Editor do Supabase.':e.message}
function openCobrancaForm(){
 const comp0=localMonth().slice(0,7);
 openModal(`<div class="modal-head"><h2>Enviar cobrança</h2><button class="btn alt" data-close-modal>Fechar</button></div><form id="cobForm"><div class="formgrid"><div class="field"><label>Unidade</label><select name="padaria_id" id="cobPad">${state.padarias.filter(p=>p.ativa).map(p=>`<option value="${p.id}">${esc(p.nome_comercial||p.nome)}</option>`).join('')}</select></div><div class="field"><label>Competência</label><input name="competencia" id="cobComp" type="month" value="${comp0}"></div></div><div class="field"><label>Mensagem (aparece no painel da padaria)</label><textarea name="mensagem" id="cobMsgTxt" maxlength="500" placeholder="Opcional"></textarea></div><div id="cobResumo" class="notice"></div><button class="btn" type="submit">Gerar e enviar à unidade</button><div id="cobMsg"></div></form>`);
 $('modal').querySelector('[data-close-modal]').onclick=closeModal;

/* ---------- Painel da padaria: cores, logo (WebP) e armazenamento ---------- */
const fmtB=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1).replace('.',',')+' KB':(b/1048576).toFixed(2).replace('.',',')+' MB';
const pubUrl=path=>path?`${SUPABASE_URL}/storage/v1/object/public/padarias/${path.split('/').map(encodeURIComponent).join('/')}`:'';
const ORIGINAL_MAX=5*1024*1024, LOGO_MAX_LADO=512, WEBP_QUALIDADE=0.82, WEBP_MAX=1024*1024;
async function paraWebP(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Formato não aceito. Use JPG, PNG ou WebP.');
 if(file.size>ORIGINAL_MAX)throw new Error('Arquivo original acima de '+fmtB(ORIGINAL_MAX)+'.');
 const bmp=await createImageBitmap(file);
 const k=Math.min(1,LOGO_MAX_LADO/Math.max(bmp.width,bmp.height));
 const w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k));
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);
 let q=WEBP_QUALIDADE,blob;
 for(let i=0;i<4;i++){blob=await new Promise(r=>cv.toBlob(r,'image/webp',q));if(!blob||blob.type!=='image/webp')throw new Error('Este navegador não converte para WebP.');if(blob.size<=WEBP_MAX)break;q-=.15}
 if(blob.size>WEBP_MAX)throw new Error('Imagem ainda acima de 1 MB após compressão.');
 return {blob,w,h};
}

 if(t.error){box.innerHTML=`<div class="msg error">${esc(t.error.message)}</div>`;return}
 const pn=(t.data.rascunho||{}).painel||{},c=pn.cores||{},us=u.data?.[0]||{limite_bytes:10485760,usado_bytes:0,arquivos:0};
 const pct=Math.min(100,us.usado_bytes/us.limite_bytes*100);

/* ---------- Dashboard Master: alertas e últimas alterações ---------- */
async function loadDash(){
 if(!$('dashBox'))return;
 const [u,h,lg,pl]=await Promise.all([sb.rpc('uso_armazenamento'),sb.from('horarios_pao').select('padaria_id').eq('ativo',true),sb.from('logs').select('acao,criado_em,padaria_id,usuario_id').order('criado_em',{ascending:false}).limit(8),sb.rpc('uso_plataforma')]);
 if(!$('dashBox'))return;
 const alertas=[],ativas=state.padarias.filter(p=>p.ativa),nm=id=>{const p=state.padarias.find(x=>x.id===id);return p?(p.nome_comercial||p.nome):'—'};
 for(const p of ativas){
  if(!state.admins.some(a=>a.padaria_id===p.id&&a.ativo))alertas.push(['bad',`${nm(p.id)}: sem administrador ativo.`]);
  if(!(h.data||[]).some(x=>x.padaria_id===p.id))alertas.push(['warn',`${nm(p.id)}: nenhum horário de pão ativo.`]);
 }
 for(const x of (u.data||[])){const pct=x.usado_bytes/x.limite_bytes*100;if(pct>=70)alertas.push([pct>=90?'bad':'warn',`${x.nome}: armazenamento em ${pct.toFixed(0)}% (${fmtB(Number(x.usado_bytes))} de ${fmtB(Number(x.limite_bytes))}).`])}
 if(pl.data){for(const [n,u2,l2] of [['Banco de dados do Supabase',pl.data.db_bytes,pl.data.db_limite],['Storage do Supabase',pl.data.storage_bytes,pl.data.storage_limite]]){const pc=u2/l2*100;if(pc>=70)alertas.unshift([pc>=90?'bad':'warn',`${n}: ${pc.toFixed(0)}% usado (${fmtB(u2)} de ${fmtB(l2)}).`])}}
 const hoje=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date());
 for(const c of state.cobrancas.filter(c=>['pendente','atrasado'].includes(c.status)&&c.vencimento_em<hoje))alertas.push(['bad',`${nm(c.padaria_id)}: mensalidade ${c.competencia.slice(5,7)}/${c.competencia.slice(0,4)} em atraso.`]);
 for(const c of state.cobrancas.filter(c=>['pendente','atrasado'].includes(c.status)&&!c.enviada_em))alertas.push(['warn',`${nm(c.padaria_id)}: cobrança ${c.competencia.slice(5,7)}/${c.competencia.slice(0,4)} ainda não enviada.`]);
 if(state.padarias.length>=30)alertas.unshift(['bad','Limite máximo de 30 padarias atingido.']);
 else if(state.padarias.length>=27)alertas.unshift(['warn',`Padarias: ${state.padarias.length} / 30 — limite próximo.`]);
 const ROTD={insert_horarios_pao:'Horário criado',update_horarios_pao:'Horário alterado',delete_horarios_pao:'Horário excluído',update_configuracoes_padaria:'Configuração alterada',update_padarias:'Dados da padaria alterados',publicar_tema:'Tema publicado',criar_padaria:'Padaria criada',criar_admin:'Administrador criado',enviar_cobranca:'Cobrança enviada',gerar_cobranca_mensal:'Cobrança gerada'};
 const tU=(u.data||[]).reduce((a,x)=>a+Number(x.usado_bytes),0),tL=(u.data||[]).reduce((a,x)=>a+Number(x.limite_bytes),0);
 $('dashBox').innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px"><div class="card"><div class="muted">Padarias ativas / inativas</div><div class="metric">${ativas.length} / ${state.padarias.length-ativas.length}</div></div><div class="card"><div class="muted">Administradores ativos</div><div class="metric">${state.admins.filter(a=>a.ativo).length}</div></div><div class="card"><div class="muted">Armazenamento</div><div class="metric">${fmtB(tU)}</div><div class="muted">de ${fmtB(tL)}</div></div><div class="card"><div class="muted">Banco Supabase</div><div class="metric">${pl.data?fmtB(pl.data.db_bytes):'—'}</div><div class="muted">${pl.data?'de '+fmtB(pl.data.db_limite):''}</div></div><div class="card"><div class="muted">Vagas livres</div><div class="metric">${Math.max(0,30-state.padarias.length)}</div></div></div>
 <h3>Alertas</h3>${alertas.length?alertas.map(([k,t])=>`<div class="msg ${k==='bad'?'error':''}" style="${k==='warn'?'background:#fff2cf;color:#785900':''}">${esc(t)}</div>`).join(''):'<div class="msg">Nenhum alerta. Tudo em ordem.</div>'}
 <h3>Últimas alterações</h3><div class="scroll"><table class="table"><tbody>${(lg.data||[]).map(l=>`<tr><td>${new Date(l.criado_em).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})}</td><td>${esc(nm(l.padaria_id))}</td><td>${esc(ROTD[l.acao]||String(l.acao).replace(/_/g,' '))}</td></tr>`).join('')||'<tr><td class="empty">Sem registros.</td></tr>'}</tbody></table></div>`;
}

function armTab(){return `<section class="panel"><div class="toolbar"><div><h2 style="margin:0">Armazenamento</h2><p class="muted">Saúde do Supabase (banco e storage) e uso de cada unidade (10 MB por padaria).</p></div><button class="btn alt" id="armRef">Atualizar</button></div><div id="platBox" style="margin-bottom:18px"><p class="muted">Medindo o Supabase…</p></div><h3 style="margin-top:0">Por padaria</h3><div id="armBox"><p class="muted">Carregando…</p></div></section>`}

async function loadPlat(){
 const box=$('platBox');if(!box)return;
 const r=await sb.rpc('uso_plataforma');if(!$('platBox'))return;
 if(r.error)return box.innerHTML=`<div class="msg error">${esc(/uso_plataforma/.test(r.error.message)?'Função uso_plataforma não encontrada. Rode supabase/migrations/20261005_uso_plataforma.sql.':r.error.message)}</div>`;
 const d=r.data,cor=p=>p>=90?'#c0392b':p>=70?'#d68910':'#2e8b57';
 const gauge=(t,u,l,extra)=>{const pct=Math.min(100,u/l*100);return `<div class="card"><div class="muted">${t}</div><div class="metric">${fmtB(u)} <span class="muted">de ${fmtB(l)}</span></div><div style="height:12px;background:#eceef1;border-radius:99px;overflow:hidden;margin:8px 0 4px"><div style="height:100%;width:${pct}%;background:${cor(pct)}"></div></div><span class="muted">${pct.toFixed(1).replace('.',',')}% usado · livre ${fmtB(Math.max(0,l-u))}${pct>=90?' · <strong>crítico</strong>':pct>=70?' · atenção':''}</span>${extra||''}</div>`};
 const reservado=state.padarias.reduce((a,p)=>a+10*1048576,0);
 box.innerHTML=`<div class="toolbar"><h3 style="margin:0">Supabase — plano atual</h3><div class="actions"><span class="muted">Medido em ${new Date(d.medido_em).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})}</span><button class="btn small alt" id="platLim">Ajustar limites</button></div></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${gauge('Banco de dados',d.db_bytes,d.db_limite,`<div class="muted" style="margin-top:6px">Inclui tabelas, índices e sistema. Logs: ${d.logs_total} registros.</div>`)}${gauge('Storage (arquivos)',d.storage_bytes,d.storage_limite,`<div class="muted" style="margin-top:6px">${d.storage_arquivos} arquivo(s). Reservado às ${state.padarias.length} padaria(s): ${fmtB(reservado)} (${(reservado/d.storage_limite*100).toFixed(0)}% do storage). Capacidade de 30: ${fmtB(300*1048576)}.</div>`)}</div>
 <div class="muted" style="margin:8px 0">Usuários cadastrados: <strong>${d.usuarios}</strong></div>
 <details><summary class="muted" style="cursor:pointer">Maiores tabelas do banco</summary><div class="scroll"><table class="table"><thead><tr><th>Tabela</th><th>Tamanho</th><th>Linhas (estimado)</th></tr></thead><tbody>${(d.tabelas||[]).map(t=>`<tr><td>${esc(t.tabela)}</td><td>${fmtB(Number(t.bytes))}</td><td>${Math.max(0,t.linhas)}</td></tr>`).join('')}</tbody></table></div></details>`;
 $('platLim').onclick=()=>{
  openModal(`<div class="modal-head"><h2>Limites do plano Supabase</h2><button class="btn alt" data-close-modal>Fechar</button></div><p class="muted">Ajuste se mudar de plano (Free: 500 MB de banco e 1 GB de storage). Servem só para calcular os percentuais e alertas.</p><form id="limForm"><div class="formgrid"><div class="field"><label>Banco de dados (MB)</label><input name="db" type="number" min="1" required value="${Math.round(d.db_limite/1048576)}"></div><div class="field"><label>Storage (MB)</label><input name="st" type="number" min="1" required value="${Math.round(d.storage_limite/1048576)}"></div></div><button class="btn" type="submit">Salvar</button><div id="limMsg"></div></form>`);
  $('modal').querySelector('[data-close-modal]').onclick=closeModal;
  $('limForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const x=await sb.from('plataforma_config').upsert({chave:'limites',valor:{db_bytes:Number(f.get('db'))*1048576,storage_bytes:Number(f.get('st'))*1048576},atualizado_em:new Date().toISOString()});if(x.error)return msg('limMsg',x.error.message,true);closeModal();loadPlat()}};
}

 const rows=r.data||[],tU=rows.reduce((a,x)=>a+Number(x.usado_bytes),0),tL=rows.reduce((a,x)=>a+Number(x.limite_bytes),0);

async function renderPadProg(id){$('sub-programacao').innerHTML=programacaoEditor(state.padarias.find(p=>p.id===id));await loadProgEditor(id);}
async function renderPadIndex(id){$('sub-index').innerHTML=indexEditor(state.padarias.find(p=>p.id===id));await loadIndexEditor(id)}
async function renderPadAssinatura(id){const a=state.assinaturas.find(x=>x.padaria_id===id)||{};$('sub-assinatura').innerHTML=`<div class="formgrid"><div class="field"><label>Plano</label><select id="assPlano">${state.planos.map(p=>`<option value="${p.id}" ${p.id===a.plano_id?'selected':''}>${esc(p.nome)} — ${money(p.valor_mensal)}</option>`).join('')}</select></div><div class="field"><label>Valor mensal</label><input id="assValor" type="number" step="0.01" value="${a.valor_mensal??30}"></div><div class="field"><label>Dia do vencimento (1–28)</label><input id="assDia" type="number" min="1" max="28" value="${a.dia_vencimento??10}"></div><div class="field"><label>Status</label><select id="assStatus"><option value="ativa">Ativa</option><option value="suspensa">Suspensa</option><option value="encerrada">Encerrada</option></select></div></div><div class="field"><label>Observações</label><textarea id="assObs">${esc(a.observacoes||'')}</textarea></div><button class="btn" id="saveAss">Salvar assinatura</button><div id="assMsg"></div>`;$('assStatus').value=a.status||'ativa';$('assPlano').onchange=()=>{const p=state.planos.find(x=>x.id===$('assPlano').value);if(p)$('assValor').value=p.valor_mensal};$('saveAss').onclick=async()=>{const payload={padaria_id:id,plano_id:$('assPlano').value,valor_mensal:Number($('assValor').value),dia_vencimento:Number($('assDia').value),status:$('assStatus').value,observacoes:$('assObs').value||null};const r=await sb.from('assinaturas_padaria').upsert(payload);if(r.error)return msg('assMsg',r.error.message,true);await carregar();msg('assMsg','Assinatura salva.')}}

function openModal(html){$('modal').innerHTML=html;$('modalBack').classList.add('open')}
function closeModal(){$('modalBack').classList.remove('open');$('modal').innerHTML=''}
$('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};
function msg(id,text,error=false){if($(id))$(id).innerHTML=`<div class="msg ${error?'error':'success'}">${esc(text)}</div>`}

async function publicarIndex(id){
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.access_token)return {ok:false,error:'Sessão Master expirada. Entre novamente.'};
  try{
    const r=await fetch('/api/estabelecimentos/publicar',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({padaria_id:id})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok)return {ok:false,error:d.error||('Falha HTTP '+r.status)};
    return d;
  }catch(e){return {ok:false,error:'Servidor de publicação não está disponível. Inicie o servidor do Hora do Pão para criar a pasta física da Index.'};}
}

function openPadariaForm(){openModal(`<div class="modal-head"><h2>Nova padaria</h2><button class="btn alt" data-close-modal>Fechar</button></div><form id="newPadForm"><div class="formgrid"><div class="field"><label>Nome *</label><input name="nome" required></div><div class="field"><label>Nome comercial</label><input name="nome_comercial"></div><div class="field"><label>Slug *</label><input name="slug" placeholder="padaria-exemplo" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></div><div class="field"><label>Telefone</label><input name="telefone"></div><div class="field"><label>E-mail</label><input name="email" type="email"></div><div class="field"><label>Cidade</label><input name="cidade"></div><div class="field"><label>Estado</label><input name="estado" maxlength="2"></div><div class="field"><label>Endereço</label><input name="endereco"></div></div><div class="field"><label>Informações públicas</label><textarea name="informacoes_publicas"></textarea></div><button class="btn" type="submit">Criar padaria</button><div id="newPadMsg"></div></form>`);$('modal').querySelector('[data-close-modal]').onclick=closeModal;$('newPadForm').onsubmit=async e=>{e.preventDefault();const payload=Object.fromEntries(new FormData(e.currentTarget).entries());const {data,error}=await sb.functions.invoke('master-management',{body:{action:'create_padaria',...payload}});if(error)return msg('newPadMsg',error.message,true);if(data?.error)return msg('newPadMsg',data.error,true);await carregar();const criada=state.padarias.find(x=>x.slug===payload.slug);if(criada){const pub=await publicarIndex(criada.id);if(pub.ok)msg('newPadMsg','Padaria criada e Index publicada em estabelecimentos/'+pub.slug+'/index.html.');else msg('newPadMsg','Padaria criada no Supabase, mas a Index ainda não foi publicada: '+pub.error,true)}else msg('newPadMsg','Padaria criada.');setTimeout(closeModal,1200);state.tab='pad';render()}}
function openAdminForm(forcePadaria){openModal(`<div class="modal-head"><h2>Novo administrador</h2><button class="btn alt" data-close-modal>Fechar</button></div><form id="newAdminForm"><div class="formgrid"><div class="field"><label>Nome *</label><input name="nome" required></div><div class="field"><label>E-mail / login *</label><input name="email" type="email" required></div><div class="field"><label>Senha inicial *</label><input name="password" type="password" minlength="8" required><div class="notice">Mínimo de 8 caracteres. O Master entrega a senha ao administrador.</div></div><div class="field"><label>Padaria *</label><select name="padaria_id" required>${state.padarias.map(p=>`<option value="${p.id}" ${p.id===forcePadaria?'selected':''}>${esc(p.nome_comercial||p.nome)}</option>`).join('')}</select></div></div><button class="btn" type="submit">Criar administrador</button><div id="newAdminMsg"></div></form>`);$('modal').querySelector('[data-close-modal]').onclick=closeModal;$('newAdminForm').onsubmit=async e=>{e.preventDefault();const payload=Object.fromEntries(new FormData(e.currentTarget).entries());const {data,error}=await sb.functions.invoke('master-management',{body:{action:'create_admin',...payload}});if(error)return msg('newAdminMsg',error.message,true);if(data?.error)return msg('newAdminMsg',data.error,true);await carregar();msg('newAdminMsg','Administrador criado com sucesso.');setTimeout(()=>{closeModal();state.tab='admin';render()},700)}}
async function toggleAdmin(id,ativo){const {data,error}=await sb.functions.invoke('master-management',{body:{action:'set_admin_active',user_id:id,ativo}});if(error)return alert(error.message);if(data?.error)return alert(data.error);await carregar();render()}
async function resetAdmin(id){const p=prompt('Digite a nova senha (mínimo 8 caracteres):');if(p===null)return;if(p.length<8)return alert('A senha precisa ter pelo menos 8 caracteres.');const {data,error}=await sb.functions.invoke('master-management',{body:{action:'reset_admin_password',user_id:id,password:p}});if(error)return alert(error.message);if(data?.error)return alert(data.error);alert('Senha alterada com sucesso.')}
async function gerarTodos(){const comp=localMonth();let ok=0,err=[];for(const a of state.assinaturas.filter(x=>x.status==='ativa')){const {error}=await sb.rpc('gerar_cobranca_mensal',{p_padaria:a.padaria_id,p_competencia:comp});if(error)err.push(error.message);else ok++}await carregar();alert(ok+' cobrança(s) gerada(s).'+(err.length?' '+err.length+' erro(s).':''));render()}
async function pagar(id){const forma=prompt('Forma de pagamento (ex.: PIX):','PIX');if(forma===null)return;const obs=prompt('Observação (opcional):','');const r=await sb.from('cobrancas_mensais').update({status:'pago',pago_em:new Date().toISOString(),forma_pagamento:forma,observacoes:obs||null}).eq('id',id);if(r.error)return alert(r.error.message);await carregar();render()}
async function togglePlan(id,ativo){const r=await sb.from('planos').update({ativo}).eq('id',id);if(r.error)return alert(r.error.message);await carregar();render()}

async function selectPadForTab(tab,selectId){const id=$(selectId)?.value;if(!id)return;state.selected=state.padarias.find(p=>p.id===id)||state.selected;render();}

document.addEventListener('change',async e=>{if(e.target.id==='progPad'){state.selected=state.padarias.find(p=>p.id===e.target.value);render()}if(e.target.id==='indexPad'){state.selected=state.padarias.find(p=>p.id===e.target.value);render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-publish-index]');if(!b)return;b.disabled=true;b.textContent='Publicando…';const r=await publicarIndex(b.dataset.publishIndex);if(r.ok){b.textContent='Publicado';setTimeout(()=>{b.disabled=false;b.textContent='Publicar'},1200)}else{alert(r.error);b.disabled=false;b.textContent='Publicar'}});

document.addEventListener('DOMContentLoaded',async()=>{const {data:{user}}=await sb.auth.getUser();if(user){state.userId=user.id;state.userName=user.email;await iniciar()}else login()});
</script>
